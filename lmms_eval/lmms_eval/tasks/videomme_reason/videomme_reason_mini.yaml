dataset_path: '/data/oss_bucket_0/video/Bench/lmms-lab/lmms-lab/Video-MME'
# dataset_path: '/home/yuxi.dwh/.cache/huggingface/videomme'
dataset_kwargs:
  token: True
  cache_dir: videomme_mini  # sampled 500 datas from full videomme task
  video: True
  # From_YouTube: True
task: videomme_reason_mini
test_split: test_mini
output_type: generate_until
doc_to_visual: !function utils.videomme_doc_to_visual
doc_to_text: !function utils.videomme_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 1024
  temperature: 0
  top_p: 1.0
  
  num_beams: 1
  do_sample: false
# The return value of process_results will be used by metrics
process_results: !function utils.videomme_process_results
# Note that the metric name can be either a registed metric function (such as the case for GQA) or a key name returned by process_results
metric_list:
  - metric: videomme_percetion_score
    aggregation: !function utils.videomme_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    # video-r1
    post_prompt: "\nPlease think about this question as if you were a human pondering deeply. Engage in an internal dialogue using expressions such as 'let me think', 'wait', 'Hmm', 'oh, I see', 'let's break it down', etc, or other natural language thought expressions. It's encouraged to include self-reflection or verification in the reasoning process. Provide your detailed reasoning between the <think> and </think> tags, and then give your final answer between the <answer> and </answer> tags.  Please provide only the single option letter (e.g., A, B, C, D, etc.) within the <answer> </answer> tags."


metadata:
  - version: 0.0
