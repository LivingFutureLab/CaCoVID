#dataset_path: lmms-lab/charades_sta
dataset_path: /data/oss_bucket_0/video/Bench/lmms-lab/lmms-lab/charades_sta
dataset_kwargs:
  token: True
  cache_dir: /data/oss_bucket_0/video/Bench/lmms-lab/lmms-lab/charades_sta/Charades_v1_480
  video: True
task: temporal_grounding_charades_reason
test_split: test

generation_kwargs:
  max_new_tokens: 1024
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false

output_type: generate_until
doc_to_visual: !function utils.temporal_grounding_doc_to_visual
doc_to_text: !function utils.temporal_grounding_doc_to_text
doc_to_target: !function utils.temporal_grounding_doc_to_answer
process_results: !function utils.temporal_grounding_process_results_generation


metric_list:
  - metric: submission
    aggregation: !function utils.temporal_grounding_aggregate_charades
    higher_is_better: true

lmms_eval_specific_kwargs:
  default:
    pre_prompt: "Find start and end seconds of the video segment that corresponds to the given textual query: "
    post_prompt: "First output the thinking process in <think> </think> tags and then output the final answer in <answer> </answer> tags. Output the final answer in JSON format."
    